<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub | Recuperar Contraseña</title>
    
    <!-- Favicon Corporativo -->
    <link rel="icon" type="image/png" href="./css/img/logo_empresa_letra.png">
    
    <!-- Hoja de Estilo Principal (Relativa) -->
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="auth-page-wrapper">

    <!-- ========================================
         TARJETA DE RECUPERACIÓN DE CONTRASEÑA
         ======================================== -->
    <article class="auth-card">
        
        <header class="auth-header">
            <a href="../index.html" class="logo-container" style="justify-content: center; margin-bottom: 1.5rem;">
                <img src="../css/img/logo_empresa_letra_v1.png" alt="SportClub Logo" class="logo-img">
            </a>
            <p class="auth-subtitle">Ingresa tu correo para restaurar tu contraseña</p>
        </header>

        <!-- Contenedor Visual Integrado para Mensajes de Retroalimentación -->
        <div id="feedback-recover" class="feedback-box">
            <!-- Rellenado dinámicamente mediante JS -->
        </div>

        <!-- Formulario de Recuperación -->
        <form id="form-recuperar" novalidate>
            
            <!-- Campo Correo -->
            <div class="form-group">
                <label for="email-recover">Correo Registrado</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <i data-lucide="mail" style="position: absolute; left: 15px; color: var(--text-muted); width: 18px;"></i>
                    <input type="email" id="email-recover" class="form-input" placeholder="ejemplo@correo.com" style="padding-left: 45px;" required>
                </div>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="btn-auth">
                Enviar Enlace <i data-lucide="send"></i>
            </button>

            <!-- Volver al Login -->
            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                <a href="./login.html" class="auth-link">Volver al Login</a>
            </div>

        </form>

    </article>

    <!-- Scripts de Lógica y Lucide -->
    <script src="../js/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
