<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub | Iniciar Sesión</title>
    
    <!-- Favicon Corporativo -->
    <link rel="icon" type="image/png" href="./css/img/logo_empresa_letra.png">
    
    <!-- Hoja de Estilo Principal (Relativa) -->
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Bootstrap CSS (iconos y JS al final) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="auth-page-wrapper">

    <!-- ========================================
         TARJETA DE AUTENTICACIÓN (LOGIN)
         ======================================== -->
    <article class="auth-card">
        
        <header class="auth-header">
            <a href="../index.html" class="logo-container" style="justify-content: center; margin-bottom: 1.5rem;">
                <img src="../css/img/logo_empresa_letra_v1.png" alt="SportClub Logo" class="logo-img">
            </a>
            <p class="auth-subtitle">Ingresa tus credenciales para acceder</p>
        </header>

        <!-- Formulario Interactivo -->
        <form onsubmit="event.preventDefault(); window.location.href='./dashboard-usuario.html';">
            
            <!-- Campo Correo -->
            <div class="form-group">
                <label for="email-login">Correo Electrónico</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <i data-lucide="mail" style="position: absolute; left: 15px; color: var(--text-muted); width: 18px;"></i>
                    <input type="email" id="email-login" class="form-input" placeholder="ejemplo@correo.com" style="padding-left: 45px;" required>
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div class="form-group">
                <label for="password-login">Contraseña</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <i data-lucide="lock" style="position: absolute; left: 15px; color: var(--text-muted); width: 18px;"></i>
                    <input type="password" id="password-login" class="form-input" placeholder="••••••••" style="padding-left: 45px;" required>
                </div>
            </div>

            <!-- Botón de Ingresar -->
            <button type="submit" class="btn-auth">
                Ingresar <i data-lucide="log-in"></i>
            </button>

            <!-- Enlaces Auxiliares -->
            <div class="auth-links">
                <a href="./recuperar.html" class="auth-link">¿Olvidaste tu contraseña?</a>
                <a href="./registro.html" class="auth-link">Crear cuenta</a>
            </div>
        </form>

        <!-- Línea Divisoria y Enlaces de Revisión Directa -->
        <div class="auth-divider">Accesos Rápidos de Revisión</div>
        
        <div class="quick-access-wrapper">
            <a href="./dashboard-coach.html" class="quick-access-btn coach">
                <i data-lucide="award" style="width: 16px;"></i> Coach
            </a>
            <a href="./dashboard-admin.html" class="quick-access-btn admin">
                <i data-lucide="shield" style="width: 16px;"></i> Administrador
            </a>
        </div>

    </article>

    <!-- Inicializar Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>

</html>
